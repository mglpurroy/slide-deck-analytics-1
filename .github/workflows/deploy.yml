name: Build and Deploy Jupyter Book

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for better caching

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Jupyter Book
      run: |
        jupyter-book build _sources --path-output ./ --builder html
      env:
        # Increase timeout for long-running cells
        JUPYTER_EXECUTE_TIMEOUT: 1200

    - name: Copy interactive HTML files
      run: |
        # Copy any interactive HTML files from notebooks to build directory
        if [ -f "_sources/notebooks/interactive_fragility_plot.html" ]; then
          cp "_sources/notebooks/interactive_fragility_plot.html" "_build/html/"
          echo "✅ Copied interactive fragility plot"
        fi
        if [ -f "_sources/notebooks/interactive_fcs_map.html" ]; then
          cp "_sources/notebooks/interactive_fcs_map.html" "_build/html/"
          echo "✅ Copied interactive FCS map"
        fi

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: _build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2