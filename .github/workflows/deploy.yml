name: Build and Deploy Jupyter Book

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Build Jupyter Book
        run: |
          jupyter-book build docs --path-output ./ --builder html
        env:
          JUPYTER_EXECUTE_TIMEOUT: 1200
          
      - name: Copy interactive HTML files
        run: |
          if [ -f "docs/notebooks/interactive_fragility_plot.html" ]; then
            cp "docs/notebooks/interactive_fragility_plot.html" "_build/html/"
            echo "✅ Copied interactive fragility plot"
          fi
          if [ -f "docs/notebooks/interactive_crime_plot.html" ]; then
            cp "docs/notebooks/interactive_crime_plot.html" "_build/html/"
            echo "✅ Copied interactive crime plot"
          fi
          if [ -f "docs/notebooks/interactive_fcs_map.html" ]; then
            cp "docs/notebooks/interactive_fcs_map.html" "_build/html/"
            echo "✅ Copied interactive FCS map"
          fi
          find _build/html -name "*.html" -exec echo "📄 Found: {}" \;
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
