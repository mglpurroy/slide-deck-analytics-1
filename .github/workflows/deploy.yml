name: Build and Deploy Jupyter Book

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Build Jupyter Book
        run: |
          jupyter-book build _sources --path-output ./ --builder html
        env:
          JUPYTER_EXECUTE_TIMEOUT: 1200
          
      - name: Copy interactive HTML files
        run: |
          # Copy any interactive HTML files generated during notebook execution
          if [ -f "_sources/notebooks/interactive_fragility_plot.html" ]; then
            cp "_sources/notebooks/interactive_fragility_plot.html" "_build/html/"
            echo "✅ Copied interactive fragility plot"
          fi
          if [ -f "_sources/notebooks/interactive_crime_plot.html" ]; then
            cp "_sources/notebooks/interactive_crime_plot.html" "_build/html/"
            echo "✅ Copied interactive crime plot"
          fi
          if [ -f "_sources/notebooks/interactive_fcs_map.html" ]; then
            cp "_sources/notebooks/interactive_fcs_map.html" "_build/html/"
            echo "✅ Copied interactive FCS map"
          fi
          # Also check if files were generated in the build directory
          find _build/html -name "*.html" -path "*/notebooks/*" -exec echo "📄 Found: {}" \;
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
