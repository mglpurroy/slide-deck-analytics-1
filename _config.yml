# Book settings
title: "FCV Analytics Notebook"
author: "World Bank FCV Team"
logo: ""
copyright: "2024"

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force
  timeout: 1200  # Increase timeout to 20 minutes for long-running cells
  allow_errors: false
  stderr_output: show

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: fcv-analytics-notebook.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/mglpurroy/slide-deck-analytics-1  # Online location of your book
  path_to_book: _sources  # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  baseurl: https://mglpurroy.github.io/slide-deck-analytics-1/
  
# Sphinx configuration
sphinx:
  config:
    html_theme_options:
      repository_url: https://github.com/mglpurroy/slide-deck-analytics-1
      use_repository_button: true
      use_issues_button: true
      use_edit_page_button: true
      path_to_docs: _sources
    html_show_sourcelink: false
    
# Launch button configuration
launch_buttons:
  notebook_interface: classic
  binderhub_url: https://mybinder.org
  colab_url: https://colab.research.google.com

# Parse and render settings
parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution
    - tasklist

# Define which files to exclude from processing
exclude_patterns:
  - _build
  - Thumbs.db
  - .DS_Store
  - "**.ipynb_checkpoints"
  - ".nox/*"
  - "README.md"