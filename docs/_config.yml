# Book settings
title: FCV Slide Deck Analytics
author: Miguel Purroy

repository:
  url: https://github.com/mglpurroy/slide-deck-analytics-1  # Replace with your actual GitHub repo
  branch: main  # Change this if your main branch is different

execute:
  execute_notebooks: force
  timeout: 1200
  allow_errors: true
  stderr_output: show

html:
  use_repository_button: true
  use_edit_page_button: true
  use_issues_button: true
  baseurl: https://mglpurroy.github.io/slide-deck-analytics-1/
  extra_navbar: ""
  extra_footer: ""

sphinx:
  config:
    html_theme_options:
      repository_url: https://github.com/mglpurroy/slide-deck-analytics-1
      use_repository_button: true
      use_issues_button: true
      use_edit_page_button: true
      path_to_docs: docs
    html_show_sourcelink: false
    html_static_path: ['_static']
    html_extra_path: ['notebooks/*.html']
    html_copy_source: false

  extra_extensions:
    - sphinx_copybutton
    - sphinx_design
    - sphinx_togglebutton